name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# One run per branch, and one for all release tags (they share :X.Y, :X and :beta),
# so images publish in push order and an older build can't overwrite a newer tag.
# Superseded PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'tag' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nimbus_test
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: ./backend
        run: |
          go mod download
          go mod verify

      - name: Run go fmt
        working-directory: ./backend
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Run tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: nimbus_test
          DB_USER: nimbus
          DB_PASSWORD: test_password
          JWT_SECRET: test-jwt-secret-key-for-ci-minimum-32-characters-required
          PORT: 8080
          CORS_ORIGINS: http://localhost:3000
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build
        working-directory: ./backend
        run: go build -v -o bin/nimbus cmd/server/main.go

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format-check

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./frontend
        env:
          JWT_SECRET: test-jwt-secret-key-for-ci-minimum-32-characters-required
        run: npm test

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          JWT_SECRET: test-jwt-secret-key-for-ci-minimum-32-characters-required
        run: npm run build

      - name: Check build output
        working-directory: ./frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed - .next directory not found"
            exit 1
          fi
          echo "Build successful"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  docker-setup:
    name: Docker Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test entrypoint script
        run: sh docker/entrypoint.test.sh

      - name: Test postgres entrypoint script
        run: sh docker/postgres/entrypoint.test.sh

  # nimbus.turboot.com: unified image with the site URL baked in (SEO)
  docker-demo:
    name: Build Demo Image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-setup]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository_owner == 'Turbootzz' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.docker-setup.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/turbootzz/nimbus-demo:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max
          build-args: |
            NEXT_PUBLIC_APP_NAME=Nimbus
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}

  # Nimbus Cloud image
  docker-cloud:
    name: Build Cloud Image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-setup]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository_owner == 'Turbootzz' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.docker-setup.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cloud image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/turbootzz/nimbus-cloud:latest
            ghcr.io/turbootzz/nimbus-cloud:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,scope=cloud,mode=max
          build-args: |
            NEXT_PUBLIC_APP_NAME=Nimbus
            NEXT_PUBLIC_NIMBUS_CLOUD=true

  # Unified all-in-one image (recommended for most users)
  #   pull request     -> build check only, nothing pushed
  #   main             -> latest, main-<sha>
  #   develop          -> dev, develop-<sha>
  #   tag v1.4.0       -> 1.4.0, 1.4, 1
  #   tag v2.0.0-beta.1 -> 2.0.0-beta.1, beta
  docker-unified:
    name: Unified Image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-setup]
    if: github.repository_owner == 'Turbootzz'
    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Floating tags (:X.Y, :X, :beta) only move forward: a v1.4.2 backport
      # after v1.5.0 still gets :1.4.2 but leaves :1 on 1.5.0
      - name: Check if tag is newest in its line
        id: newest
        if: env.PUBLISH == 'true' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAGS=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||')
          v=${TAG#v}; major=${v%%.*}; minor=$(cut -d. -f2 <<< "$v")
          is_newest() { [[ "$(grep -E "$1" <<< "$TAGS" | sort -V | tail -1)" == "$TAG" ]] && echo true || echo false; }
          {
            echo "minor=$(is_newest "^v$major\.$minor\.[0-9]+$")"
            echo "major=$(is_newest "^v$major\.[0-9]+\.[0-9]+$")"
            echo "beta=$(is_newest '^v[0-9]+\.[0-9]+\.[0-9]+-')"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Extract metadata for unified image
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nimbus
          # Semver tags never move latest; only main does
          flavor: latest=false
          # {{major}} and {{major}}.{{minor}} are skipped for pre-releases
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.newest.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.newest.outputs.major == 'true' }}
            type=raw,value=beta,enable=${{ steps.newest.outputs.beta == 'true' }}

      - name: Build and push unified image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=unified
          # PR builds only read the cache, so they can't evict main/develop layers
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,scope=unified,mode=max' || '' }}
          build-args: |
            NEXT_PUBLIC_APP_NAME=Nimbus

  # Postgres image for both compose files, main only. The separate
  # nimbus-backend/nimbus-frontend images are frozen, see docs/MIGRATION.md
  docker:
    name: Postgres Image
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-setup]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository_owner == 'Turbootzz' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.docker-setup.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Custom PostgreSQL image with auto-migration
      - name: Extract metadata for postgres
        id: meta-postgres
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nimbus-postgres
          tags: |
            type=raw,value=18
            type=raw,value=latest

      - name: Build and push postgres image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/postgres
          file: ./docker/postgres/Dockerfile
          push: true
          tags: ${{ steps.meta-postgres.outputs.tags }}
          labels: ${{ steps.meta-postgres.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-setup, docker-unified, docker, docker-demo, docker-cloud]
    if: always()
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Publish jobs are skipped outside main/develop/tags, so 'skipped' counts as success
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' > /dev/null; then
            echo "Some CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"

# Nimbus Self-Hosted Dashboard
# Quick Start: Only DB_PASSWORD and JWT_SECRET are required!
#
# 1. Create a .env file with:
#    DB_PASSWORD=your-secure-password
#    JWT_SECRET=your-32-character-minimum-secret-key
#
# 2. Run: docker-compose up -d
#
# All other settings have sensible defaults. See .env.example for optional overrides.

services:
  db:
    image: postgres:18-alpine
    container_name: nimbus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nimbus-network

  backend:
    image: turboot/nimbus-backend:latest
    container_name: nimbus-backend
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Optional overrides (uncomment to customize):
      # PORT: 8080
      # DB_HOST: db
      # DB_PORT: 5432
      # DB_USER: nimbus
      # DB_NAME: nimbus
      # CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - nimbus-network

  frontend:
    image: turboot/nimbus-frontend:latest
    container_name: nimbus-frontend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => {if (r.statusCode !== 200 && r.statusCode !== 307) throw new Error(r.statusCode)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nimbus-network

volumes:
  postgres_data:

networks:
  nimbus-network:
    driver: bridge
# Nimbus Self-Hosted Dashboard - Unified Deployment
# Quick Start: Only DB_PASSWORD and JWT_SECRET are required!
#
# 1. Create a .env file with:
#    DB_PASSWORD=your-secure-password
#    JWT_SECRET=your-32-character-minimum-secret-key
#
# 2. Run: docker-compose up -d
#
# That's it! Access Nimbus at http://localhost:3000
#
# For advanced users who prefer separate containers, see docker-compose.deprecated.yml

services:
  db:
    image: postgres:18-alpine
    container_name: nimbus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nimbus-network

  nimbus:
    image: turboot/nimbus:latest
    container_name: nimbus
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db
      # No CORS_ORIGINS needed - same-origin mode!
      # No NEXT_PUBLIC_API_URL needed - same-origin mode!
      # Optional overrides:
      # DB_PORT: 5432
      # DB_USER: nimbus
      # DB_NAME: nimbus
    volumes:
      - uploads_data:/app/backend/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nimbus-network

volumes:
  postgres_data:
  uploads_data:

networks:
  nimbus-network:
    driver: bridge

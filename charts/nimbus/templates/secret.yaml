{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nimbus.fullname" . }}
  labels:
    {{- include "nimbus.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "Set secrets.dbPassword (or secrets.existingSecret)" .Values.secrets.dbPassword | quote }}
  {{- with .Values.secrets.jwtSecret }}
  jwt-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.encryptionKey }}
  encryption-key: {{ . | quote }}
  {{- end }}
{{- end }}

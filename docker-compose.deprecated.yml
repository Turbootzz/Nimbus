# Nimbus Self-Hosted Dashboard (Separate Containers)
# For most users, the unified image is recommended. See docker-compose.yml instead.
#
# Required environment variables for split-container deployment:
#   DB_PASSWORD=your-secure-password
#   JWT_SECRET=your-32-character-minimum-secret-key
#   NEXT_PUBLIC_API_URL=http://YOUR_SERVER_IP:8080  # Required! Use your server's IP, not "backend"
#
# Example .env:
#   DB_PASSWORD=mysecretpassword
#   JWT_SECRET=your-32-character-minimum-secret-key
#   NEXT_PUBLIC_API_URL=http://192.168.1.100:8080
#   CORS_ORIGINS=http://192.168.1.100:3000
#
# Run: docker-compose -f docker-compose.deprecated.yml up -d

services:
  db:
    image: postgres:18-alpine
    container_name: nimbus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nimbus
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nimbus-network

  backend:
    image: turboot/nimbus-backend:latest
    container_name: nimbus-backend
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Optional overrides (uncomment to customize):
      # PORT: 8080
      # DB_HOST: db
      # DB_PORT: 5432
      # DB_USER: nimbus
      # DB_NAME: nimbus
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - nimbus-network

  frontend:
    image: turboot/nimbus-frontend:latest
    container_name: nimbus-frontend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      # IMPORTANT: Set NEXT_PUBLIC_API_URL to your backend's external URL
      # - For local network: http://YOUR_SERVER_IP:8080 (e.g., http://192.168.1.100:8080)
      # - For reverse proxy: https://your-domain.com (proxy must route /api/v1/* to backend)
      # - Do NOT use "http://backend:8080" - browsers cannot resolve Docker internal hostnames!
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => {if (r.statusCode !== 200 && r.statusCode !== 307) throw new Error(r.statusCode)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nimbus-network

volumes:
  postgres_data:
  uploads_data:

networks:
  nimbus-network:
    driver: bridge

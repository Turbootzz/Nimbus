resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

nimbus:
  postgres_image_selector: postgres_18_image
  db_password: nimbus
  additional_envs: []
network:
  web_port:
    bind_mode: published
    port_number: 30080

ix_volumes:
  uploads: /opt/tests/mnt/nimbus/uploads
  postgres_data: /opt/tests/mnt/nimbus/postgres_data

storage:
  uploads:
    type: ix_volume
    ix_volume_config:
      dataset_name: uploads
      create_host_path: true
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  additional_storage: []

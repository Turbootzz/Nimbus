{% set tpl = ix_lib.base.render.Render(values) %}

{% set nimbus_net = tpl.networks.create_internal("nimbus-net") %}

{% set c1 = tpl.add_container(values.consts.nimbus_container_name, "image") %}
{% do c1.add_network(nimbus_net) %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.nimbus.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.nimbus.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(nimbus_net) %}

{% do c1.set_user(0, 0) %}
{# nginx: its master runs as root and writes to directories owned by the nginx user #}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("wget", {"port": values.consts.internal_web_port, "path": "/api/v1/health"}) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}

{# The entrypoint waits for the database and checks it with these, so no DB_URL #}
{% do c1.environment.add_env("DB_HOST", values.consts.postgres_container_name) %}
{% do c1.environment.add_env("DB_PORT", 5432) %}
{% do c1.environment.add_env("DB_USER", values.consts.db_user) %}
{% do c1.environment.add_env("DB_NAME", values.consts.db_name) %}
{% do c1.environment.add_env("DB_PASSWORD", values.nimbus.db_password) %}
{% do c1.environment.add_user_envs(values.nimbus.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage("/app/backend/uploads", values.storage.uploads) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
